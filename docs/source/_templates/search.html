{%- extends "basic/search.html" %}

{% block searchbox %}
  <form class="searchform" action="" method="get">
    <label class="visually-hidden" for="searchinput">Search documentation</label>
    <input id="searchinput" type="text" name="q" value="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <button type="submit">{{ _('search') }}</button>
  </form>
  <p><span id="search-progress"></span></p>
{% endblock %}
