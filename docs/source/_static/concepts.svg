<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="concepts-title concepts-desc">
  <title id="concepts-title">Deed, log, bag, citation</title>
  <desc id="concepts-desc">Bytes feed a deed. The deed feeds a log leaf. The log has a head. Export writes a bag with a receipt. A citation names the accession.</desc>
  <style>
    .box { fill: #efe9dc; stroke: #c8bda5; stroke-width: 1.5; }
    .bar { fill: #e6a23c; }
    .name { font: 600 18px "Source Sans 3", "Liberation Sans", "DejaVu Sans", sans-serif; fill: #15130f; }
    .detail { font: 400 14px "Source Sans 3", "Liberation Sans", "DejaVu Sans", sans-serif; fill: #47423a; }
    .arrow { stroke: #7f520b; stroke-width: 1.6; fill: none; }
  </style>
  <g id="bytes">
    <rect class="box" x="80" y="16" width="480" height="70" rx="8"/>
    <rect class="bar" x="80" y="16" width="6" height="70" rx="2"/>
    <text class="name" x="104" y="44">Bytes</text>
    <text class="detail" x="104" y="66">SHA-256 of the product file</text>
  </g>
  <path class="arrow" d="M320 90 v22"/>
  <path d="M313 106 l7 10 7-10z" fill="#7f520b"/>
  <g id="deed">
    <rect class="box" x="80" y="120" width="480" height="70" rx="8"/>
    <rect class="bar" x="80" y="120" width="6" height="70" rx="2"/>
    <text class="name" x="104" y="148">Deed</text>
    <text class="detail" x="104" y="170">accession, kind, producer, sources</text>
  </g>
  <path class="arrow" d="M320 194 v22"/>
  <path d="M313 210 l7 10 7-10z" fill="#7f520b"/>
  <g id="log">
    <rect class="box" x="80" y="224" width="480" height="70" rx="8"/>
    <rect class="bar" x="80" y="224" width="6" height="70" rx="2"/>
    <text class="name" x="104" y="252">Log</text>
    <text class="detail" x="104" y="274">one RFC 9162 leaf per deed</text>
  </g>
  <path class="arrow" d="M320 298 v22"/>
  <path d="M313 314 l7 10 7-10z" fill="#7f520b"/>
  <g id="head">
    <rect class="box" x="80" y="328" width="480" height="70" rx="8"/>
    <rect class="bar" x="80" y="328" width="6" height="70" rx="2"/>
    <text class="name" x="104" y="356">Head</text>
    <text class="detail" x="104" y="378">size, root, signature when a key is set</text>
  </g>
  <path class="arrow" d="M320 402 v22"/>
  <path d="M313 418 l7 10 7-10z" fill="#7f520b"/>
  <g id="bag">
    <rect class="box" x="80" y="432" width="480" height="70" rx="8"/>
    <rect class="bar" x="80" y="432" width="6" height="70" rx="2"/>
    <text class="name" x="104" y="460">Bag</text>
    <text class="detail" x="104" y="482">deed, bytes, evidence, receipt</text>
  </g>
  <path class="arrow" d="M320 506 v22"/>
  <path d="M313 522 l7 10 7-10z" fill="#7f520b"/>
  <g id="citation">
    <rect class="box" x="80" y="536" width="480" height="70" rx="8"/>
    <rect class="bar" x="80" y="536" width="6" height="70" rx="2"/>
    <text class="name" x="104" y="564">Citation</text>
    <text class="detail" x="104" y="586">the accession, named by a tracker or a pack</text>
  </g>
</svg>
