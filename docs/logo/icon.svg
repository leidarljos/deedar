<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="deedar">
  <rect width="200" height="200" rx="36" fill="#0B0B0A"/>
  <!-- receipt -->
  <g transform="rotate(-7 100 100)">
    <rect x="52" y="38" width="96" height="124" rx="6" fill="#F4F0E6"/>
    <line x1="68" y1="68" x2="132" y2="68" stroke="#0B0B0A" stroke-width="4" stroke-linecap="round" opacity="0.28"/>
    <line x1="68" y1="88" x2="124" y2="88" stroke="#0B0B0A" stroke-width="4" stroke-linecap="round" opacity="0.28"/>
    <line x1="68" y1="108" x2="116" y2="108" stroke="#0B0B0A" stroke-width="4" stroke-linecap="round" opacity="0.28"/>
  </g>
  <!-- wax seal -->
  <circle cx="128" cy="138" r="26" fill="#E6A23C"/>
  <circle cx="128" cy="138" r="16" fill="none" stroke="#0B0B0A" stroke-width="3" opacity="0.35"/>
  <!-- pin through the seal -->
  <circle cx="128" cy="122" r="8" fill="#E6A23C" stroke="#0B0B0A" stroke-width="2"/>
  <rect x="125.2" y="122" width="5.6" height="22" rx="2.8" fill="#E6A23C" stroke="#0B0B0A" stroke-width="1.5"/>
</svg>
