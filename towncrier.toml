[tool.towncrier]
name = "deedar"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/leidarljos/deedar/pull/{issue})"
underlines = ["", "", ""]
# Setting ignore, even to nothing, is what makes `towncrier build` fail a
# fragment whose name has no configured type. Unset, that file is skipped
# and the draft still passes. .gitkeep stays ignored either way.
ignore = []

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
