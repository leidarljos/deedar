name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # release.yml publishes macOS archives, so the suite runs on macOS too.
  # Formatting and clippy are the ubuntu job's checks. Their components are
  # installed anyway because rust-toolchain.toml lists them, so rustup adds
  # none on the first cargo call.
  test-macos:
    runs-on: macos-latest
    # The ubuntu job bounds fmt, clippy, and this same test command
    # together at 20 minutes. This job runs the tests under that same bound.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo test --workspace

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Same components as test-macos, for the same reason.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check
