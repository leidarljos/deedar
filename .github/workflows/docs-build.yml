name: docs-build

# Build the site and stop. The docs workflow is the one that publishes
# GitHub Pages. This job has no Pages permission and no secrets.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs-build.yml", ".impeccable/**"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs-build.yml", ".impeccable/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends pandoc ttf-mscorefonts-installer
      - run: bash .github/render-og-png.sh
      - run: bash docs/scripts/export_org_to_rst.sh
      - run: python -m pip install -q -r docs/requirements.txt
      - run: sphinx-build -b html -n -W docs/source docs/build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y impeccable@4.5.2 detect docs/build
      - name: Copy rustdoc next to the HTML
        run: |
          set -euo pipefail
          rm -rf docs/build/rustdoc
          mkdir -p docs/build/rustdoc
          cp -a target/doc/. docs/build/rustdoc/
