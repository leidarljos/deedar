[workspace]
resolver = "2"
members = [
    "crates/deed",
    "crates/deedar",
    "crates/deedar-cli",
    "crates/deedar-mcp",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
deed = { path = "crates/deed" }
deedar = { path = "crates/deedar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
ureq = "2.12"
tempfile = "3"

# Workspace crates keep file/line for panic backtraces. Dependencies
# carry no debug info. `cargo build --profile debugging` is full debug.
[profile.dev]
debug = "line-tables-only"
opt-level = 1
lto = "off"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"
