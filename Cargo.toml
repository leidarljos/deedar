[workspace]
resolver = "2"
members = [
    "crates/deed",
    "crates/deedar",
    "crates/deedar-cli",
    "crates/deedar-mcp",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.6.1"
publish = true
rust-version = "1.85"
repository = "https://github.com/leidarljos/deedar"
homepage = "https://leidarljos.github.io/deedar/"

[workspace.dependencies]
# Internal pins follow [workspace.package] version. cog writes these lines.
# Change that version, then run `cog -r @cogfiles.txt`.
# [[[cog import versions; cog.out(versions.pins()) ]]]
deed = { package = "deedar-deed", path = "crates/deed", version = "0.6.1" }
deedar = { path = "crates/deedar", version = "0.6.1" }
# [[[end]]]
# The Merkle tree and its tiled storage are the rfc9162 repository
# (https://github.com/leidarljos/rfc9162). rfc9162-tiles comes from
# that repository until its first crates.io release.
rfc9162 = "0.6.1"
rfc9162-tiles = { git = "https://github.com/leidarljos/rfc9162", version = "0.6.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
ureq = "2.12"
tempfile = "3"

# Workspace crates keep file/line for panic backtraces. Dependencies
# carry no debug info. `cargo build --profile debugging` is full debug.
[profile.dev]
debug = "line-tables-only"
opt-level = 1
lto = "off"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"
