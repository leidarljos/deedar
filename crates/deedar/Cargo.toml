[package]
name = "deedar"
version.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "One-writer deed store and Cap'n client"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/deedar-v{ version }-{ target }.tar.gz"
bin-dir = "deedar-v{ version }-{ target }/deedar{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
libc = "0.2"
deed.workspace = true
ed25519-dalek = "2"
sha2.workspace = true
hmac.workspace = true
ureq.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
ed25519-dalek = "2"
sha2.workspace = true
tempfile.workspace = true

[[bench]]
name = "handover"
harness = false
