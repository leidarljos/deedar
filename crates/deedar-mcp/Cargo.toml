[package]
name = "deedar-mcp"
version.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model Context Protocol server over a deed store: what a unit of work produced, and whether the store still answers for it"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/deedar-v{ version }-{ target }.tar.gz"
bin-dir = "deedar-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "deedar-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
deed.workspace = true
deedar.workspace = true
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-async-rw", "macros"] }
schemars = "1"
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

[dev-dependencies]
tempfile.workspace = true
